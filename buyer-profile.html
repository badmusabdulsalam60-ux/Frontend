<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buyer Profile | AgroConnect</title>

    <link rel="stylesheet" href="buyer-profile.css">
</head>

<body>

    <main class="profile-container">

        <header class="profile-header">
            <a href="buyer-dashboard.html" class="back-link">
                ← Back to Dashboard
            </a>

            <h1>My Profile</h1>
            <p>Manage your personal and business information.</p>
        </header>


        <section class="profile-summary">

            <div class="profile-avatar" id="profile-avatar">
                B
            </div>

            <div>
                <h2 id="profile-name">Buyer Name</h2>
                <p>AgroConnect Buyer</p>
                <span class="account-badge">Buyer Account</span>
            </div>

        </section>


        <form id="buyer-profile-form">

            <!-- PERSONAL INFORMATION -->

            <section class="profile-card">

                <h2>Personal Information</h2>
                <p class="section-description">
                    Your basic account details.
                </p>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" disabled>
                    </div>

                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" disabled>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" disabled>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" disabled>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" disabled>
                    </div>

                </div>

            </section>


            <!-- BUSINESS INFORMATION -->

            <section class="profile-card">

                <h2>Business Information</h2>
                <p class="section-description">
                    Tell farmers more about your business.
                </p>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="business-name">Business Name</label>
                        <input
                            type="text"
                            id="business-name"
                            placeholder="Enter your business name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="business-address">Business Address</label>
                        <input
                            type="text"
                            id="business-address"
                            placeholder="Enter your business address"
                        >
                    </div>

                    <div class="form-group">
                        <label for="state">State</label>
                        <input
                            type="text"
                            id="state"
                            placeholder="Enter your state"
                        >
                    </div>

                </div>

            </section>


            <!-- ACTION BUTTONS -->

            <div class="profile-actions">

                <button type="submit" class="save-button">
                    Save Changes
                </button>

                <button type="button" id="cancel-button" class="cancel-button">
                    Cancel
                </button>

            </div>

            <p id="save-message"></p>

        </form>

    </main>


    <script src="api.js"></script>
<script src="buyer-profile.js"></script>

</body>
</html>
